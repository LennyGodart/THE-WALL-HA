name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -r requirements_test.txt ruff
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: python -m pytest tests -q
